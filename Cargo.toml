[workspace]
members = [
    "crates/sgdf-core",
    "crates/sgdf-api",
    "crates/sgdf-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Laurent Vaylet <laurent.vaylet@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lvaylet/sgdf-tools"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
encoding_rs = "0.8"
html-escape = "0.2"
phonenumber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
comfy-table = "7.1"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
utoipa = { version = "6.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
